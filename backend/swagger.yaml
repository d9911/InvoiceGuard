openapi: 3.0.0
info:
  title: InvoiceGuard API
  description: API для сервиса приема платежей (тестовое задание)
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Local server

paths:
  /auth/login:
    post:
      summary: Вход в систему
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        200:
          description: Успешный вход или требование 2FA

  /auth/2fa/enable:
    post:
      summary: Генерация секрета 2FA
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: QR-код и секрет

  /auth/2fa/verify:
    post:
      summary: Подтверждение и включение 2FA
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, example: "123456" }
      responses:
        200:
          description: 2FA включен
      tags: [Invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency, merchantId]
              properties:
                amount:
                  type: integer
                  example: 10000
                  description: Сумма в минимальных единицах (копейки/центы)
                currency:
                  type: string
                  example: "USD"
                merchantId:
                  type: string
                  example: "merchant_123"
      responses:
        201:
          description: Счет создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /invoice/{id}:
    get:
      summary: Получение статуса счета
      tags: [Invoices]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Информация о счете
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /webhook:
    post:
      summary: Прием статуса оплаты (Webhook)
      tags: [Webhooks]
      description: |
        Требует заголовки:
        - X-Signature: HMAC-SHA256(body, merchant_secret)
        - X-Timestamp: Unix timestamp (seconds)
        - X-Nonce: Unique random string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoiceId, status]
              properties:
                invoiceId:
                  type: string
                status:
                  type: string
                  enum: [paid, failed]
      responses:
        200:
          description: Статус обновлен

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Invoice:
      type: object
      properties:
        invoiceId:
          type: string
        merchantId:
          type: string
        amount:
          type: integer
        currency:
          type: string
        fee:
          type: integer
        amountToReceive:
          type: integer
        status:
          type: string
          enum: [pending, paid, failed]
        createdAt:
          type: string
          format: date-time
