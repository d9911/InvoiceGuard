services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice-guard-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/invoice-guard
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: invoice-guard-frontend
    ports:
      - "5176:5176"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: invoice-guard-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: invoice-guard-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  mongodb:
    image: mongo:6.0
    container_name: invoice-guard-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.0-alpine
    container_name: invoice-guard-redis
    ports:
      - "6379:6379"

volumes:
  mongo_data:
